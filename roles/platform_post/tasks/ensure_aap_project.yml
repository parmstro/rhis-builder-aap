---
# This task creates the aap project from the list

- name: "Ensure that project {{ aap_project.name }} is {{ aap_project.state }}"  # noqa name[template]
  ansible.controller.project:
    controller_host: "{{ aap_platform_host }}"
    controller_username: "{{ aap_platform_username }}"
    controller_password: "{{ aap_platform_password }}"
    credential: "{{ aap_project.credential }}"
    default_environment: "{{ aap_project.default_environment | default(omit) }}"
    description: "{{ aap_project.description | default(omit) }}"
    local_path: "{{ aap_project.local_path | default(omit) }}"
    name: "{{ aap_project.name }}"
    new_name: "{{ aap_project.new_name | default(omit) }}"
    organization: "{{ aap_project.organization | default('Default') }}"
    scm_branch: "{{ aap_project.scm_branch | default(omit) }}"
    scm_clean: "{{ aap_project.scm_clean | default(omit) }}"
    scm_delete_on_update: "{{ aap_project.scm_delete_on_update | default(omit) }}"
    scm_refspec: "{{ aap_project.scm_refspec | default(omit) }}"
    scm_track_submodules: "{{ aap_project.scm_track_submodules | default(omit) }}"
    scm_type: "{{ aap_project.scm_type }}"
    scm_update_cache_timeout: "{{ aap_project.scm_update_cache_timeout | default(omit) }}"
    scm_update_on_launch: "{{ aap_project.scm_update_on_launch | default(omit) }}"
    scm_url: "{{ aap_project.scm_url | default(omit) }}"
    state: "{{ aap_project.state | default(present) }}"
    timeout: "{{ aap_project.timeout | default(omit) }}"
    update_project: "{{ aap_project.update_project | default(omit) }}"
    validate_certs: "{{ aap_validate_certs | default(true) }}"
    wait: "{{ aap_project.wait | default(omit) }}"
