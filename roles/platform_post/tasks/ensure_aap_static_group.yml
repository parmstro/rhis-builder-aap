---
# Add the statically defined groups to the controller

- name: "Ensure that group {{ aap_static_group.name }} is {{ aap_static_group.state }}"  # noqa name[template]
  ansible.controller.group:
    controller_host: "{{ aap_platform_host }}"
    controller_username: "{{ aap_platform_username }}"
    controller_password: "{{ aap_platform_password }}"
    children: "{{ aap_static_group.children | default(omit) }}"
    description: "{{ aap_static_group.description | default(omit) }}"
    hosts: "{{ aap_static_group.hosts | default(omit) }}"
    inventory: "{{ aap_static_group.inventory }}"
    name: "{{ aap_static_group.name }}"
    new_name: "{{ aap_static_group.new_name | default(omit) }}"
    preserve_existing_children: "{{ aap_static_group.preserve_existing_children | default(false) }}"
    preserve_existing_hosts: "{{ aap_static_group.preserve_existing_hosts | default(false) }}"
    state: "{{ aap_static_group.state | default('present') }}"
    validate_certs: "{{ aap_validate_certs }}"
    variables: "{{ aap_static_group.variables | default(omit) }}"

...
