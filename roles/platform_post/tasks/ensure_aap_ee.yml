---
# Build and upload an execution_environment
- name: "Create the base directory"
  ansible.builtin.file:
    path: "{{ aap_execution_environment.git_dest }}"
    state: directory
    mode: "0644"

- name: "Clone the git repo for the execution_environment"
  ansible.builtin.git:
    repo: "{{ aap_execution_environment.git_repo }}"
    version: "{{ aap_execution_environment.git_revision | default(omit) }}"
    dest: "{{ aap_execution_environment.git_dest }}/{{ aap_execution_environment.name }}"
    clone: "{{ aap_execution_environment.git_clone | default(omit) }}"
    force: "{{ aap_execution_environment.git_force | default(omit) }}"

- name: "Template the exec_envs definition"
  ansible.builtin.template:
    src: "execution-environment.yml.j2"
    dest: "{{ aap_execution_environment.git_dest }}/{{ aap_execution_environment.name }}/execution-environment.yml"
    mode: "0600"

- name: "Template the ansible requirements.yml"
  ansible.builtin.template:
    src: "{{ aap_execution_environment.ansible_requirements_template }}"
    dest: "{{ aap_execution_environment.git_dest }}/{{ aap_execution_environment.name }}/requirements.yml"
    mode: "0600"

- name: "Template the python requirements.txt"
  ansible.builtin.template:
    src: "{{ aap_execution_environment.python_requirements_template }}"
    dest: "{{ aap_execution_environment.git_dest }}/{{ aap_execution_environment.name }}/requirements.txt"
    mode: "0600"

- name: "Template the system requirements bindep.txt"
  ansible.builtin.template:
    src: "{{ aap_execution_environment.system_requirements_template }}"
    dest: "{{ aap_execution_environment.git_dest }}/{{ aap_execution_environment.name }}/bindep.txt"
    mode: "0600"

- name: "Get the satellite API certificate"
  ansible.builtin.get_url:
    url: "{{ satellite_url }}/pub/katello-server-ca.crt"
    dest: "{{ aap_execution_environment.git_dest }}/{{ aap_execution_environment.name }}/katello-server-ca.crt"
    mode: "0644"

# Build parameters will now pull from the above location - no need to copy

- name: "Build the execution_environment on the target os"
  ansible.builtin.shell: >
    ansible-builder build -t {{ aap_execution_environment.name }} > 
    ~/ansible-builder_{{ aap_execution_environment.name }}-{{ ansible_date_time.iso8601_basic_short }}.log 2>&1
  args:
    chdir: "{{ aap_execution_environment.git_dest }}/{{ aap_execution_environment.name }}"
  register: build_result
  changed_when: build_result.rc == 0
  ignore_errors: true

- name: "Build Result"
  ansible.builtin.debug:
    var: build_result

- name: "Set the deployment status"
  when: build_result.rc == 0
  ansible.builtin.set_fact:
    hub_is_deployed: false

- name: "Check the private automation hub endpoint"
  when: build_result.rc == 0
  ansible.builtin.uri:
    url: "http://{{ groups['aap_hubs'][0] }}/v2"
  register: hub_uri_result
  failed_when: false

- name: "Set the deployment status"
  when: build_result.rc == 0 and hub_uri_result.status == 200
  ansible.builtin.set_fact:
    hub_is_deployed: true

- name: "Push the finished container to the hub"
  when: build_result.rc == 0 and hub_is_deployed
  containers.podman.podman_image:
    name: "{{ aap_execution_environment.name }}"
    push: true
    username: "{{ aap_admin_username }}"
    password: "{{ aap_admin_password }}"
    push_args:
      destination: "{{ groups['aap_hubs'][0] }}/{{ aap_execution_environment.name }}:latest"
      remove_signatures: "{{ aap_execution_environment.remove_signatures | default(true) }}"
    validate_certs: "{{ aap_hub_validate_certs | default(true) }}"

- name: "Clean up the deployment directory"
  when: build_result.rc == 0
  ansible.builtin.file:
    path: "{{ aap_execution_environment.git_dest }}/{{ aap_execution_environment.name }}"
    state: absent

- name: "Fail the loop iteration intentionally if the build failed"
  # 5. Signal a failure state to your overarching play summary *after* steps are processed
  when: build_result.rc != 0
  ansible.builtin.fail:
    msg: "The execution environment build for '{{ aap_execution_environment.name }}' failed. Directory preserved at {{ aap_execution_environment.git_dest }}/{{ aap_execution_environment.name }} for debugging."
