---
# This task creates the aap template from the list
#

- name: "Ensure template state {{ aap_job_template.name }}"
  ansible.controller.job_template:
    controller_host: "{{ aap_platform_host }}"
    controller_username: "{{ aap_platform_username }}"
    controller_password: "{{ aap_platform_password }}"
    allow_simultaneous: "{{ aap_job_template.allow_simultaneous | default(omit) }}"
    ask_credential_on_launch: "{{ aap_job_template.ask_credential_on_launch | default(omit) }}"
    ask_diff_mode_on_launch: "{{ aap_job_template.ask_diff_mode_on_launch | default(omit) }}"
    ask_execution_environment_on_launch: "{{ aap_job_template.ask_execution_environment_on_launch | default(omit) }}"
    ask_forks_on_launch: "{{ aap_job_template.ask_forks_on_launch | default(omit) }}"
    ask_instance_groups_on_launch: "{{ aap_job_template.ask_instance_groups_on_launch | default(omit) }}"
    ask_inventory_on_launch: "{{ aap_job_template.ask_inventory_on_launch | default(omit) }}"
    ask_job_slice_count_on_launch: "{{ aap_job_template.ask_job_slice_count_on_launch | default(omit) }}"
    ask_job_type_on_launch: "{{ aap_job_template.ask_job_type_on_launch | default(omit) }}"
    ask_labels_on_launch: "{{ aap_job_template.ask_labels_on_launch | default(omit) }}"
    ask_scm_branch_on_launch: "{{ aap_job_template.ask_scm_branch_on_launch | default(omit) }}"
    ask_skip_tags_on_launch: "{{ aap_job_template.ask_skip_tags_on_launch | default(omit) }}"
    ask_tags_on_launch: "{{ aap_job_template.ask_tags_on_launch | default(omit) }}"
    ask_timeout_on_launch: "{{ aap_job_template.ask_timeout_on_launch | default(omit) }}"
    ask_variables_on_launch: "{{ aap_job_template.ask_variables_on_launch | default(omit) }}"
    ask_verbosity_on_launch: "{{ aap_job_template.ask_verbosity_on_launch | default(omit) }}"
    become_enabled: "{{ aap_job_template.become_enabled | default(omit) }}"
    credentials: "{{ aap_job_template.credentials }}"
    description: "{{ aap_job_template.description | default(omit) }}"
    diff_mode: "{{ aap_job_template.diff_mode | default(omit) }}"
    execution_environment: "{{ aap_job_template.execution_environment | default('Default') }}"
    extra_vars: "{{ aap_job_template.variables | default(omit) }}"
    force_handlers: "{{ aap_job_template.force_handlers | default(omit) }}"
    forks: "{{ aap_job_template.forks | default(omit) }}"
    instance_groups: "{{ aap_job_template.instance_groups | default(omit) }}"
    inventory: "{{ aap_job_template.inventory }}"
    job_slice_count: "{{ aap_job_template.job_slice_count | default(omit) }}"
    job_tags: "{{ aap_job_template.job_tags | default(omit) }}"
    job_type: "{{ aap_job_template.job_type | default('run') }}"
    labels: "{{ aap_job_template.labels | default(omit) }}"
    limit: "{{ aap_job_template.limit | default(omit) }}"
    name: "{{ aap_job_template.name }}"
    new_name: "{{ aap_job_template.new_name | default(omit) }}"
    organization: "{{ aap_job_template.organization | default('Default') }}"
    playbook: "{{ aap_job_template.playbook | default('main.yml') }}"
    project: "{{ aap_job_template.project }}"
    scm_branch: "{{ aap_job_template.scm_branch | default(omit) }}"
    skip_tags: "{{ aap_job_template.skip_tags | default(omit) }}"
    start_at_task: "{{ aap_job_template.start_at_task | default(omit) }}"
    state: "{{ aap_job_template.state | default('present') }}"
    survey_enabled: "{{ aap_job_template.survey_enabled | default(omit) }}"
    survey_spec: "{{ aap_job_template.survey_spec | default(omit) }}"
    timeout: "{{ aap_job_template.timeout | default(omit) }}"
    use_fact_cache: "{{ aap_job_template.use_fact_cache | default(omit) }}"
    validate_certs: "{{ aap_validate_certs | default(true) }}"
    vault_credential: "{{ aap_job_template.vault_credential | default(omit) }}"
    verbosity: "{{ aap_job_template.verbosity | default(omit) }}"
    webhook_credential: "{{ aap_job_template.webhook_credential | default(omit) }}"
    webhook_service: "{{ aap_job_template.webhook_service | default(omit) }}"
