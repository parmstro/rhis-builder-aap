- name: Create a workflow approval node
  ansible.controller.workflow_job_template_node:
    controller_host: "{{ aap_platform_host }}"
    controller_username: "{{ aap_platform_username }}"
    controller_password: "{{ aap_platform_password }}"
    identifier: approval_test
    workflow: "SOE_ContentDeliveryPipeline"
    organization: "Default"
    approval_node:
      name: "approval_test"
      description: "Test the approval"
      timeout: 900

- name: Connect delete snap to approval node
  ansible.controller.workflow_job_template_node:
    controller_host: "{{ aap_platform_host }}"
    controller_username: "{{ aap_platform_username }}"
    controller_password: "{{ aap_platform_password }}"
    identifier: "DeleteSnapshot"
    workflow: "SOE_ContentDeliveryPipeline"
    organization: "Default"
    success_nodes:
      - "approval_test"
    failure_nodes:
      - "PowerOffHosts"

- name: Connect delete snap to approval node
  ansible.controller.workflow_job_template_node:
    controller_host: "{{ aap_platform_host }}"
    controller_username: "{{ aap_platform_username }}"
    controller_password: "{{ aap_platform_password }}"
    identifier: "approval_test"
    workflow: "SOE_ContentDeliveryPipeline"
    organization: "Default"
    success_nodes:
      - "DeleteHosts"
