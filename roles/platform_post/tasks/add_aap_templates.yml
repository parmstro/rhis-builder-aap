---
# This tasks creates the templates

- name: "Add the templates to the controller"
  when: aap_job_templates is defined and (aap_job_templates | length) > 0
  ansible.builtin.include_tasks: "ensure_aap_template.yml"
  loop: "{{ aap_job_templates }}"
  loop_control:
    loop_var: aap_job_template
  no_log: true

...
